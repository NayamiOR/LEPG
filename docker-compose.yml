services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lepgs
      POSTGRES_PASSWORD: lepgs123
      POSTGRES_DB: lepgs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lepgs -d lepgs"]
      interval: 5s
      timeout: 3s
      retries: 5

  lepg-server:
    build: .
    ports:
      - "8883:8883"
      - "1883:1883"
      - "8083:8083"
    environment:
      LOG_PATH: /app/data/logs
      DATA_PATH: /app/data/lepgs.db
    volumes:
      # 容器内使用 docker 专用配置（pg_host=postgres 指向 compose 服务名）
      - ./config/server-docker.toml:/app/config/server.toml:ro
      - lepg-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  lepg-data:
