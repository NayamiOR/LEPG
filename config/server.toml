log_level = 'info'
log_path = 'logs/'
port = 8883
# PostgreSQL configuration
pg_host = "127.0.0.1"
pg_port = 5432
pg_user = "lepgs"
pg_password = "lepgs123"
pg_dbname = "lepgs"
pg_sslmode = "disable"

# MQTT broker 配置
mqtt_tcp = "127.0.0.1:1883"
mqtt_ws = "127.0.0.1:8083"

# 客户端列表配置
# 定义允许连接到服务器的客户端
[[clients]]
sn = "CLIENT001"
token = "token123456"
description = "测试客户端1"

[[clients]]
sn = "CLIENT002"
token = "token789012"
description = "测试客户端2"

[[clients]]
sn = "CLIENT003"
token = "token345678"
description = "生产环境客户端"

# ── 北向数据输出配置 ──
# 每个 [[outputs]] 块定义一个外部输出目标。
# type 决定平台 + 传输方式，各平台按需取用认证字段。

# ThingsBoard Gateway MQTT（推模式）
# LEPG 作为 MQTT 客户端主动向 TB 推送遥测数据
# [[outputs]]
# type = "thingsboard-mqtt"
# name = "tb-mqtt"
# enabled = true
# host = "thingsboard.cloud"
# port = 1883
# qos = 1
# token = "YOUR_GATEWAY_ACCESS_TOKEN"

# ThingsBoard Gateway HTTP（推模式）
# [[outputs]]
# type = "thingsboard-http"
# name = "tb-http"
# enabled = true
# host = "thingsboard.cloud"
# port = 443
# token = "YOUR_GATEWAY_ACCESS_TOKEN"
